[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "canadian-parliament-voting"
version = "0.1.0"
description = "Reproducible Canadian House of Commons voting behaviour analysis"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "jupyterlab>=4.0,<5",
    "matplotlib>=3.8,<4",
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "requests>=2.31,<3",
    "seaborn>=0.13,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/canadian_parliament"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv]
default-groups = ["dev"]

[project.scripts]
run-pipeline = "canadian_parliament.preprocessing:run"
